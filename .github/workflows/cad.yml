name: CAD validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  export-mesh-and-slice:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install CAD and slicer tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes openscad prusa-slicer

      - name: Export and validate printable meshes
        run: scripts/export_printables.sh

      - name: Run Ender 3 V2 slicer smoke tests
        run: scripts/slice_smoke_test.sh

      - name: Upload validated STL pack
        uses: actions/upload-artifact@v7
        with:
          name: ender3v2-print-pack
          path: |
            build/stl/*.stl
            slicer/*.ini
